name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Bundle (Android)
        # Dummy PUBLIC values so the bundle builds with a complete config. They are not real
        # credentials; real values come from EAS environment variables at build time. They are
        # scoped to this step so the unit tests run without any EXPO_PUBLIC_* values.
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-dummy-firebase-api-key
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-meetingguard.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-meetingguard
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-meetingguard.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          EXPO_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 000000000000-dummyweb.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 000000000000-dummyios.apps.googleusercontent.com
        run: npx expo export --platform android --no-bytecode --output-dir dist/ci-export

      - name: Check the bundle for secrets
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir=dist/ci-export/_expo/static/js/android
          # OpenAI keys (sk-... / sk-proj-..., which contain "T3BlbkFJ"), Google OAuth client
          # secrets (GOCSPX-), Supabase service_role keys and Stripe webhook secrets must never
          # be shipped. (A plain "sk-" also matches icon names such as "flask-", so the OpenAI
          # check looks for a standalone "sk-" token followed by a key-like string.)
          if grep -rEo '(^|[^A-Za-z])sk-(proj-)?[A-Za-z0-9_-]{20,}|T3BlbkFJ|GOCSPX|service_role|whsec_' "$bundle_dir"; then
            echo "::error::Secret-like value found in the app bundle"
            exit 1
          fi
          echo "No secrets found in the bundle."

  # A Cloud Functions job (/functions: build, lint, rules tests) is added in a later stage.
