name: CI

# Private repo on GitHub Free: 2,000 Actions minutes a month, so CI runs only where it protects
# something:
# - pull requests into v2 (staging) and main (production), but NOT while the PR is a draft: open a
#   PR as a draft while still pushing to it, then click "Ready for review" to run CI once;
# - pushes to main (the release merge). Merges into v2 are already checked on their PR, and the
#   v2 -> main release PR checks the combined code; to check v2 by hand use Actions > CI >
#   "Run workflow";
# - never on work branches (dev_dusko, dev_sven) or docs-only changes.
# The Android bundle step runs only for main (release PRs, pushes and manual runs).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, v2]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Node ${{ matrix.node }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A healthy run takes about 7 minutes; the cap stops a hang from burning the monthly minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 22 only (the Cloud Functions runtime); a second version doubled the cost.
        node: [22]
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        # --forceExit: since Oct 27 every suite passes in about 2 minutes but Jest never exits
        # (a handle left open after the run), so the job sat idle until the timeout cancelled it.
        run: npm test -- --ci --forceExit

      - name: Bundle (Android)
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        # Dummy PUBLIC values so the bundle builds with a complete config. They are not real
        # credentials; real values come from EAS environment variables at build time. They are
        # scoped to this step so the unit tests run without any EXPO_PUBLIC_* values.
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-dummy-firebase-api-key
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-meetingguard.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-meetingguard
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-meetingguard.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          EXPO_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 000000000000-dummyweb.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 000000000000-dummyios.apps.googleusercontent.com
        run: npx expo export --platform android --no-bytecode --output-dir dist/ci-export

      - name: Check the bundle for secrets
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir=dist/ci-export/_expo/static/js/android
          # Fail closed: a missing folder or an empty export (e.g. a changed Expo output layout)
          # must not pass as "no secrets found".
          if [ ! -d "$bundle_dir" ] || ! compgen -G "$bundle_dir/*.js" > /dev/null; then
            echo "::error::No JavaScript bundle in $bundle_dir: the export failed or its layout changed"
            exit 1
          fi
          # OpenAI keys (sk-... / sk-proj-..., which contain "T3BlbkFJ"), Google OAuth client
          # secrets (GOCSPX-), Supabase service_role keys and Stripe webhook secrets must never
          # be shipped. (A plain "sk-" also matches icon names such as "flask-", so the OpenAI
          # check looks for a standalone "sk-" token followed by a key-like string.)
          # grep exits 0 on a match, 1 on no match and 2+ on an error: only 1 passes.
          status=0
          grep -rEo '(^|[^A-Za-z])sk-(proj-)?[A-Za-z0-9_-]{20,}|T3BlbkFJ|GOCSPX|service_role|whsec_' "$bundle_dir" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Secret-like value found in the app bundle"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::The secret scan could not read the bundle (grep exit $status)"
            exit 1
          fi
          echo "No secrets found in the bundle."

  functions:
    name: Cloud Functions
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Shared AI contract matches the app
        # functions/src/shared/aiContract.ts must be a verbatim copy of src/core/aiContract.ts.
        run: npm run check:contract

      - name: Lint
        run: npm run lint

      - name: Type check (sources and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

  firestore-rules:
    name: Firestore rules (emulator)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # firebase-tools 15 emulators need Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('functions/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Rules tests
        # demo-* project id: the emulator never touches a real Firebase project.
        run: npm run test:rules
